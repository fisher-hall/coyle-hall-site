# Hall Staff data
#
# rector / priest — featured full-width bio cards at the top of the page
# members         — standard card grid (ARs + RAs)
#
# Member fields:
#   name, role, image, email  — required
#   hometown, major, minor, studying, hobbies, favoritepart, section  — optional; omit to hide
#   studying: use instead of major for graduate students

rector:
  name: "Joey Quinones"
  image: "/images/headshots/joeyquinones.jpg"
  email: "jquinon3@nd.edu"
  bio: |
    Joey Quinones is the Rector of Coyle Hall. Originally from Southern California,
    he graduated with a B.S.
    in Mechanical Engineering and a minor in Theology in 2018, and in 2020, he graduated from
    the ACE program with a M.Ed. after teaching in Tulsa for two years.
    In 2021, he graduated from Notre Dame with a M.S. in Entrepreneurship through the ESTEEM program, while serving as an AR in Baumer Hall.
    He then became Rector of Fisher Hall the following year.


    To Joey, being a rector means being welcomed into the life of another person,
    and to him, there is no greater privilege.
    In addition to being a rector, Joey is an Assistant Coach of the
    Women's and Men's Boxing Clubs and works part-time for the McDonald Center for Student Well-being.

priest:
  name: "Fr. Greg Haake, C.S.C."
  image: "/images/headshots/frgreg.jpg"
  email: "ghaake@nd.edu"
  website: "https://romancelanguages.nd.edu/people/gregory-haake/"
  bio: >-
    Fr. Greg is the priest in residence of Coyle Hall.
    Originally from Kansas City, MO, he now lives on the first floor of the dorm,
    and organizes various faith-based events, including all sacrament opportunities in Coyle.
    In addition to his duties in Coyle, Fr. Greg is also the University's Vice President for
    Mission Engagement and Church Affairs, as well as an Associate Professor of French in the
    Department of Romance Languages and Literatures.
    Ordained a priest in 2007, he received both a B.A. and an M.Div. from the University of
    Notre Dame and joined the faculty in 2015. He enjoys reading, watching movies, and is an avid Kansas City Chiefs fan.
    His favorite part of Coyle Hall is all of the students, of course!

