<!-- Search Modal -->
<div id="search-modal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50">
  <div class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-2xl mx-4 rounded-2xl shadow-lg" style="background-color: #0a843d;">
      <div class="p-6">
        <div class="flex items-center justify-between mb-4">
          <i class="fa-solid fa-search text-2xl text-white"></i>
          <h3 class="text-2xl font-semibold text-white">Search</h3>
          <button id="close-search" class="text-white hover:text-gray-200">
            <i class="fa-solid fa-times text-2xl"></i>
          </button>
        </div>
        <div class="mb-4">
          <input
            type="text"
            id="search-input"
            placeholder="Search..."
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-2xl bg-white dark:bg-darkmode-light focus:outline-none focus:ring-1 focus:ring-green-500 focus:border-green-500"
          />
        </div>
        <div id="search-results" class="max-h-96 overflow-y-auto">
          <!-- Search results will be populated here -->
        </div>
      </div>
    </div>
  </div>
</div>

<style>
#search-results h4 {
  color: white !important;
}
#search-results p {
  color: #f3f4f6 !important;
}
#search-results .text-blue-600 {
  color: white !important;
}
#search-results .text-gray-600,
#search-results .text-gray-700,
#search-results .text-gray-500 {
  color: #f3f4f6 !important;
}
#search-results div:hover {
  background-color: rgba(255, 255, 255, 0.1) !important;
}
#search-results .hover\:bg-gray-50:hover {
  background-color: rgba(255, 255, 255, 0.1) !important;
}
</style>

<!-- Simple search script -->
<script src="/js/simple-search.js"></script>
