<!-- Search Modal -->
<div id="search-modal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50">
  <div class="flex items-center justify-center min-h-screen">
    <div class="bg-white dark:bg-darkmode-body w-full max-w-2xl mx-4 rounded-lg shadow-lg">
      <div class="p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-xl font-semibold">Search</h3>
          <button id="close-search" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
            <i class="fa-solid fa-times text-xl"></i>
          </button>
        </div>
        <div class="mb-4">
          <input
            type="text"
            id="search-input"
            placeholder="Search the site..."
            class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-darkmode-light focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div id="search-results" class="max-h-96 overflow-y-auto">
          <!-- Search results will be populated here -->
        </div>
      </div>
    </div>
  </div>
</div>
